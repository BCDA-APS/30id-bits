# Not yet represented declaratively:
# - MAC_MOT/PSE_MAC_MOT/ANC300 motors need controller-specific device
#   classes and PV prefixes, not just an EpicsMotor prefix.

# TODO: In SPEC, Attocube channels `anc1` and `anc2` do not come from EPICS.
#     The ANC300 documentation confirms that the controller is accessed over Ethernet or serial, with a host/device configuration, not through EPICS PVs:
#     - install/spec_6.13.07_alma97_x64_APS_102934/help/anc.rst:18-36
#     It also states that ANC300 controllers cannot report actual position; SPEC estimates position during motion:
#     - .../help/anc.rst:46-51
#     So anc1 and anc2 have SPEC motor mnemonics and direct ANC300 channels, but no corresponding EPICS PV names in this configuration.
