# Guarneri-style device YAML configuration

# Motor PVs and controller-unit mappings were checked with spec2ophyd
# against the HERIX SPEC config. The EPICS_M2 unit determines the IOC prefix;
# it must not be flattened to a single 30idb:m<channel> namespace.

apsbits.utils.sim_creator.predefined_device:
- { creator: ophyd.sim.motor, name: sim_motor }
- { creator: ophyd.sim.noisy_det, name: sim_det }

# Unambiguous SPEC `gm` groups converted to MotorBundle devices. These bundles
# preserve the established SPEC group names. Standalone motor alternatives
# are retained as commented reference entries in the EpicsMotor section.
apstools.devices.mb_creator:
- name: wbs
  prefix: "30ida:"
  motors:
    vertical_bottom: "m1"
    horizontal_right: "m2"
    vertical_top: "m3"
    horizontal_left: "m4"
  labels: ["slit"]

- name: crl
  prefix: "30ida:"
  motors:
    y: "m5"
    x: "m6"
    ax: "m8"
    ay: "m21"
  labels: ["crl"]

- name: hhlm
  prefix: "30ida:"
  motors:
    theta: "m9"
    y1: "m10"
    z2: "m11"
    theta2: "m12"
    x2: "m13"
    chi2: "m14"
    xt: "m15"
    yt: "m16"
  labels: ["mirror"]

- name: hmono
  prefix: "30ida:"
  motors:
    x1: "m33"
    x2: "m34"
    x3: "m35"
    theta1: "m36"
    theta2: "m37"
    theta3: "m38"
    y1: "m39"
    y2: "m40"
    y3: "m41"
    tilt1: "m42"
    tilt3: "m43"
    mini1: "m46"
    mini2: "m47"
    ic2_y: "m68"
    ic3_y: "m69"
  labels: ["monochromator"]

# The SPEC `arm` group contains tth plus five auxiliary Herix-arm axes.
# tth is owned by the E4CH device; these five axes are bundled here.
- name: herix_arm
  prefix: "30idc:"
  motors:
    x: "x"
    y: "y"
    z: "z"
    ax: "ax"
    ay: "ay"
  labels: ["herix_arm", "detector"]

hklpy2.creator:
- name: herix
  geometry: E4CH
  solver: hkl_soleil
  prefix: "30idc:"
  reals:
    tth: Herix_theta
    th: m26
    chi: m27
    phi: m28
  labels: ["diffractometer"]

- name: simherix
  geometry: E4CH
  solver: hkl_soleil
  labels: ["diffractometer"]

# EPICS motors not owned by a bundle or the HERIX diffractometer.
ophyd.EpicsMotor:
# EPICS_M2:0, beamline optics and slits
# Grouped by `wbs`, so the standalone declarations remain reference-only.
# - {name: wbsvb, prefix: "30ida:m1", labels: ["motor", "slit"]}
# - {name: wbshr, prefix: "30ida:m2", labels: ["motor", "slit"]}
# - {name: wbsvt, prefix: "30ida:m3", labels: ["motor", "slit"]}
# - {name: wbshl, prefix: "30ida:m4", labels: ["motor", "slit"]}
# Grouped by `crl`, so the standalone declarations remain reference-only.
# - {name: crly, prefix: "30ida:m5", labels: ["motor"]}
# - {name: crlx, prefix: "30ida:m6", labels: ["motor"]}
- {name: bim1, prefix: "30ida:m7", labels: ["motor"]}
# - {name: crlax, prefix: "30ida:m8", labels: ["motor"]}
# Grouped by `hhlm`, so the standalone declarations remain reference-only.
# - {name: hhlmth, prefix: "30ida:m9", labels: ["motor", "mirror"]}
# - {name: hhlmy1, prefix: "30ida:m10", labels: ["motor", "mirror"]}
# - {name: hhlmz2, prefix: "30ida:m11", labels: ["motor", "mirror"]}
# - {name: hhlmth2, prefix: "30ida:m12", labels: ["motor", "mirror"]}
# - {name: hhlmx2, prefix: "30ida:m13", labels: ["motor", "mirror"]}
# - {name: hhlmch2, prefix: "30ida:m14", labels: ["motor", "mirror"]}
# - {name: hhlmxt, prefix: "30ida:m15", labels: ["motor", "mirror"]}
# - {name: hhlmyt, prefix: "30ida:m16", labels: ["motor", "mirror"]}
- {name: bslvd, prefix: "30ida:m17", labels: ["motor", "slit"]}
- {name: bslvu, prefix: "30ida:m18", labels: ["motor", "slit"]}
- {name: bslho, prefix: "30ida:m19", labels: ["motor", "slit"]}
- {name: bslhi, prefix: "30ida:m20", labels: ["motor", "slit"]}
# Grouped by `crl`, so the standalone declaration remains reference-only.
# - {name: crlay, prefix: "30ida:m21", labels: ["motor"]}
# Note: `crl` currently includes the SPEC group's physical EPICS motors;
# `crlax` and `crlay` remain commented reference entries here.
# Secondary monochromator: `secth` is the Bragg-angle motor used by
# secmono.mac for E3 calculations and scans. SPEC does not group `secy` or
# `secx` with it, and no macro use was found for those two axes.
- {name: secth, prefix: "30ida:m57", labels: ["motor", "secondary_mono"]}
- {name: secy, prefix: "30ida:m62", labels: ["motor", "secondary_mono"]}
- {name: secx, prefix: "30ida:m60", labels: ["motor", "secondary_mono"]}

# EPICS_M2:0, high-resolution monochromator
