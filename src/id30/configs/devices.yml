# Guarneri-style device YAML configuration

# NOTE: config defines 164 motors, did we get them all?
# 30ida:m1 .. 48 defined, nothing higher

apsbits.utils.sim_creator.predefined_device:
- { creator: ophyd.sim.motor, name: sim_motor }
- { creator: ophyd.sim.noisy_det, name: sim_det }


apstools.devices.mb_creator:

- name: apd
  motors:
    th: 30idb:m19
    x: 30idb:m23
    y: 30idb:m24
  labels: ["FWD-APD"]

- name: analyzer
  motors:
    an1:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m39
          ay: 30idc:m40
          diameter: 30idd:m9
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:1:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an2:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m41
          ay: 30idc:m42
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:6:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an3:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m43
          ay: 30idc:m44
          diameter: 30idd:m10
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:2:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an4:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m45
          ay: 30idc:m46
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:7:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an5:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m47
          ay: 30idc:m48
          diameter: 30idc:SM20
          focus: 30idd:m13
          pin: 30idd:m3
          slit: 30idc:m59
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:3:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an6:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m49
          ay: 30idc:m50
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:8:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an7:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m51
          ay: 30idc:m52
          diameter: 30idd:m11
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:4:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an8:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m53
          ay: 30idc:m54
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:9:Total_RBV", class: "ophyd.EpicsSignalRO"}
    an9:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          ax: 30idc:m55
          ay: 30idc:m56
          diameter: 30idd:m12
          roi_total: {read_pv: "s30_pilatus1:ROIStat1:5:Total_RBV", class: "ophyd.EpicsSignalRO"}

- name: b2_slit
  motors:
    up: 30ida:m58
    down: 30ida:m59
    inboard: 30ida:m61
    outboard: 30ida:m63
  labels: ["slit"]

- name: crl
  prefix: "30ida:"
  motors:
    y: "m5"
    x: "m6"
    ax: "m8"
    ay: "m21"
  labels: ["crl"]

- name: bslit
  prefix: "30ida:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    up: m18
    down: m17
    outboard: m19
    inboard: m20
  labels: ["slit"]

- name: btable
  motors:
    x: 30idb:SM7
    y: 30idb:SM10
    z: 30idb:SM9
  labels: ["B-table"]

- name: cslit
  prefix: "30idc:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    up: m18
    down: m17
    outboard: m20
    inboard: m19
  labels: ["slit"]

- name: heat_stage
  motors:
    # TODO: Change to read-only?  PVs not found 2026-10-30
    temperature1: {read_pv: "30idct:D1Ch1_calc.VAL", class: "ophyd.EpicsSignal"}
    temperature2: {read_pv: "30idct:D1Ch2_calc.VAL", class: "ophyd.EpicsSignal"}
    temperature3: {read_pv: "30idct:D1Ch3_calc.VAL", class: "ophyd.EpicsSignal"}
  labels: ["Heat-Stage"]

- name: hhlm
  prefix: "30ida:"
  motors:
    theta: "m9"
    y1: "m10"
    z2: "m11"
    theta2: "m12"
    x2: "m13"
    chi2: "m14"
    xt: "m15"
    yt: "m16"
  labels: ["mirror"]

- name: hfm
  prefix: "30idbt:"
  motors:
    x: "pm7"
    th: "pm8"
    curv: pm3
    ell: "pm4"
    fu: "m14"
    fd: "m15"
    x1u: "m12"
    x2d: "m13"
    y1d: "m9"
    y2o: "m10"
    y3i: "m11"
  labels: ["HFM"]

- name: hkbt
  motors:
    x: {read_pv: "30idbt:HKBtable.X", class: "ophyd.EpicsSignal"}
    y: {read_pv: "30idbt:HKBtable.Y", class: "ophyd.EpicsSignal"}
    z: {read_pv: "30idbt:HKBtable.Z", class: "ophyd.EpicsSignal"}
    ax: {read_pv: "30idbt:HKBtable.AX", class: "ophyd.EpicsSignal"}
    ay: {read_pv: "30idbt:HKBtable.AY", class: "ophyd.EpicsSignal"}
    az: {read_pv: "30idbt:HKBtable.AZ", class: "ophyd.EpicsSignal"}
  labels: ["HKB_table"]

- name: hrm
  prefix: "30ida:"
  motors:
    x1: "m33"
    x2: "m34"
    x3: "m35"
    theta1: "m36"
    theta2: "m37"
    theta3: "m38"
    y1: "m39"
    y2: "m40"
    y3: "m41"
    tilt1: "m42"
    tilt3: "m43"
    mini1: "m46"
    mini2: "m47"
    ic1x: "m22"
    ic1y: "m67"
    ic2x: "m23"
    ic2y: "m68"
    ic3x: "m24"
    ic3y: "m69"
  labels: ["monochromator"]

- name: micro
  prefix: "30idc:"
  motors:
    x: "m37"
    y: "m36"
    z: "m38"

- name: phpl
  motors:
    x: "30ida:m26"
    y: "30ida:m25"
    th: "30ida:SM1"
    thc: "30ida:m72"

- name: prosilica
  motors:
    zoom: 30idb:m17
    focus: 30idb:m18
  labels: ["Prosilica"]

- name: rubyc
  motors:
    focus: '30idc:m64'
    zoom: '30idc:m4'
    ay: '30idc:m24'
    x: '30idd:m1'
    y: '30idd:m14'
  labels: ["Rubyc"]

- name: sample_motors
  labels: ["sample"]
  motors:
    b:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          x_b: 30idb:m25
          y_b: 30idb:m26
          z_b: 30idb:m27
          chi: 30idb:m10
          phi: 30idb:m28
    slit:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        # TODO: apstools might have a support class if there is EPICS database support
        motors:
          x: 30idc:m58
          y: 30idc:m57
        # labels: ["slit"]
    table:
      factory:
        function: apstools.devices.motor_factory.mb_class_factory
        motors:
          x: 30idc:m21
          y: 30idc:m16
          z: 30idc:m23
        # labels: ["table"]

- name: vfm
  prefix: "30idbt:"
  motors:
    x: "pm9"
    yaw: "pm10"
    y: "pm5"
    th: "pm6"
    curv: "pm1"
    ell: "pm2"
    fu: "m5"
    fd: "m6"
    x1u: "m1"
    x2d: "m2"
    y1u: "m3"
    y2d: "m4"
  labels: ["VFM"]

- name: wbslit
  prefix: "30ida:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    vertical_bottom: "m1"
    horizontal_right: "m2"
    vertical_top: "m3"
    horizontal_left: "m4"
  labels: ["slit"]


hklpy2.creator:
- name: herix
  geometry: E4CH
  solver: hkl_soleil
  # TODO: connect with monochromator energy
  reals:
    th: 30idc:m26
    chi: 30idc:m27
    phi: 30idc:m28
    # tth: 30idc:Herix_theta  # FIXME: PV not found
    tth: 30idc:m25
    # TODO: additional motors on the detector arm (PVs not responding 2026-10-30)
    # x: "30idc:Herix_x"
    # y: "30idc:Herix_y"
    # z: "30idc:Herix_z"
    # ax: "30idc:Herix_ax"
    # ay: "30idc:Herix_ay"
  labels: ["diffractometer"]

- name: simherix
  geometry: E4CH
  solver: hkl_soleil
  reals: ["th", "chi", "phi", "tth"]
  labels: ["diffractometer"]


ophyd.EpicsMotor:

- {name: bim1, prefix: "30ida:m7", labels: ["motor"]}

- {name: cam_x, prefix: "30idc:m29", labels: ["motor"]}
- {name: cam_y, prefix: "30idc:m22", labels: ["motor",]}
- {name: cam_z, prefix: "30idc:m31", labels: ["motor"]}  # aka: focus

- {name: fpd_x, prefix: "30idd:m4", labels: ["motor", "FPD-X"]}

- {name: geth, prefix: "30ida:m27", labels: ["motor", "Ge_th"]}

- {name: phip, prefix: "30idMCS2:m1", labels: ["motor", "PHI_plus"]}

- {name: rbs_xy, prefix: "30idc:m30", labels: ["motor"]}

- {name: secth, prefix: "30ida:m57", labels: ["motor", "secondary_mono"]}
- {name: secy, prefix: "30ida:m62", labels: ["motor", "secondary_mono"]}
- {name: secx, prefix: "30ida:m60", labels: ["motor", "secondary_mono"]}

- {name: tab_x1, prefix: "30idb:m20", labels: ["motor", "Table_X1_U"]}

# TODO: grouping?
- {name: xu, prefix: "30idc:m9", labels: ["motor"]}
- {name: yu, prefix: "30idc:m11", labels: ["motor"]}
- {name: zu, prefix: "30idc:m10", labels: ["motor"]}
- {name: xd, prefix: "30idc:m12", labels: ["motor"]}
- {name: yd, prefix: "30idc:m13", labels: ["motor"]}

# Remember, energy units here are "meV"
- {name: herixE, prefix: "30idc:SM13", labels: ["motor", "energy"]}
- {name: nrsE, prefix: "30idc:SM18", labels: ["motor", "energy"]}


