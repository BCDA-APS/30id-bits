# EPICS_M2:2, HERIX spectrometer and sample environment
- {name: s2th, prefix: "30idc:m25", labels: ["motor", "spectrometer"]}
- {name: cam_x, prefix: "30idc:m29", labels: ["motor", "detector"]}
# Shared with `hrmic1x`; both are reference-only under this configuration.
# - {name: cam_y, prefix: "30idc:m22", labels: ["motor", "detector"]}
- {name: cam_z, prefix: "30idc:m31", labels: ["motor", "detector"]}
# These are unit-2 EPICS motors, distinct from the unit-0 bundle members.
- {name: stbly, prefix: "30idc:m16", labels: ["motor", "sample"]}
- {name: stblx, prefix: "30idc:m21", labels: ["motor", "sample"]}
- {name: stblz, prefix: "30idc:m23", labels: ["motor", "sample"]}
- {name: slity, prefix: "30idc:m58", labels: ["motor", "slit"]}
- {name: slitx, prefix: "30idc:m57", labels: ["motor", "slit"]}
# `tth` is owned by the `herix` E4CH device; this is a reference entry.
# - {name: tth, prefix: "30idc:Herix_theta", labels: ["motor", "diffractometer"]}
# These soft motors are owned by the active `herix_arm` bundle; the
# standalone forms remain commented here as reference.
# - {name: hx, prefix: "30idc:Herix_x", labels: ["motor", "diffractometer"]}
# - {name: hy, prefix: "30idc:Herix_y", labels: ["motor", "diffractometer"]}
# - {name: hz, prefix: "30idc:Herix_z", labels: ["motor", "diffractometer"]}
# - {name: hax, prefix: "30idc:Herix_ax", labels: ["motor", "diffractometer"]}
# - {name: hay, prefix: "30idc:Herix_ay", labels: ["motor", "diffractometer"]}
- {name: herixE, prefix: "30idc:SM13", labels: ["motor", "energy"]}
- {name: nrsE, prefix: "30idc:SM18", labels: ["motor", "energy"]}
# hrmic2y and hrmic3y are included in the active `hmono` bundle.
# These standalone entries are retained only as reference.
# - {name: hrmic2y, prefix: "30ida:m68", labels: ["motor", "detector"]}
# - {name: hrmic3y, prefix: "30ida:m69", labels: ["motor", "detector"]}
# hrmic1y/hrmic1x/hrmic2x/hrmic3x are unit-0 motors.
- {name: hrmic1y, prefix: "30ida:m67", labels: ["motor", "detector"]}
- {name: hrmic1x, prefix: "30ida:m22", labels: ["motor", "detector"]}
- {name: hrmic2x, prefix: "30ida:m23", labels: ["motor", "detector"]}
- {name: hrmic3x, prefix: "30ida:m24", labels: ["motor", "detector"]}
# The E4CH axes are owned by `herix`; `tth` uses the named soft-motor PV.

# Counter devices. The scaler channel mapping and PV suffixes come directly
# from CNT000-CNT035 in the SPEC config.
ophyd.scaler.ScalerCH:
- name: scaler1
  prefix: "30idb:scaler1"
  labels: ["scaler", "detector"]

ophyd.EpicsSignal:
- {name: aim_adc1_r0, prefix: "30idb:aim_adc1.R0", labels: ["detector"]}
- {name: aim_adc1_r1, prefix: "30idb:aim_adc1.R1", labels: ["detector"]}
- {name: aim_adc1_r2, prefix: "30idb:aim_adc1.R2", labels: ["detector"]}
- {name: scaler1_userTran1J, prefix: "30idb:1:userTran1.J", labels: ["detector"]}
- {name: temperature1, prefix: "30idct:D1Ch1_calc.VAL", labels: ["temperature", "baseline"]}
- {name: temperature2, prefix: "30idct:D1Ch2_calc.VAL", labels: ["temperature", "baseline"]}
- {name: temperature3, prefix: "30idct:D1Ch3_calc.VAL", labels: ["temperature", "baseline"]}

