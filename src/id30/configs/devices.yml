# Guarneri-style device YAML configuration

# NOTE: config defines 164 motors, did we get them all?

apsbits.utils.sim_creator.predefined_device:
- { creator: ophyd.sim.motor, name: sim_motor }
- { creator: ophyd.sim.noisy_det, name: sim_det }


apstools.devices.mb_creator:
- name: crl
  prefix: "30ida:"
  motors:
    y: "m5"
    x: "m6"
    ax: "m8"
    ay: "m21"
  labels: ["crl"]

- name: bslit
  prefix: "30ida:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    up: m18
    down: m17
    outboard: m19
    inboard: m20
  labels: ["slit"]

- name: cslit
  prefix: "30idc:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    up: m18
    down: m17
    outboard: m20
    inboard: m19
  labels: ["slit"]

- name: hhlm
  prefix: "30ida:"
  motors:
    theta: "m9"
    y1: "m10"
    z2: "m11"
    theta2: "m12"
    x2: "m13"
    chi2: "m14"
    xt: "m15"
    yt: "m16"
  labels: ["mirror"]

- name: hfm
  prefix: "30idbt:"
  motors:
    x: "pm7"
    th: "pm8"
    curv: pm3
    ell: "pm4"
    fu: "m14"
    fd: "m15"
    x1u: "m12"
    x2d: "m13"
    y1d: "m9"
    y2o: "m10"
    y3i: "m11"
  labels: ["HFM"]

- name: hkbt
  motors:
    x: {read_pv: "30idbt:HKBtable.X", class: "ophyd.EpicsSignal"}
    y: {read_pv: "30idbt:HKBtable.Y", class: "ophyd.EpicsSignal"}
    z: {read_pv: "30idbt:HKBtable.Z", class: "ophyd.EpicsSignal"}
    ax: {read_pv: "30idbt:HKBtable.AX", class: "ophyd.EpicsSignal"}
    ay: {read_pv: "30idbt:HKBtable.AY", class: "ophyd.EpicsSignal"}
    az: {read_pv: "30idbt:HKBtable.AZ", class: "ophyd.EpicsSignal"}
  labels: ["HKB_table"]

- name: hrm
  prefix: "30ida:"
  motors:
    x1: "m33"
    x2: "m34"
    x3: "m35"
    theta1: "m36"
    theta2: "m37"
    theta3: "m38"
    y1: "m39"
    y2: "m40"
    y3: "m41"
    tilt1: "m42"
    tilt3: "m43"
    mini1: "m46"
    mini2: "m47"
    ic1x: "m22"
    ic1y: "m67"
    ic2x: "m23"
    ic2y: "m68"
    ic3x: "m24"
    ic3y: "m69"
  labels: ["monochromator"]

- name: micro
  prefix: "30idc:"
  motors:
    x: "m37"
    y: "m36"
    z: "m38"

- name: sample_slit
  prefix: "30idc:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    x: m58
    y: m57
  labels: ["slit"]

- name: vfm
  prefix: "30idbt:"
  motors:
    x: "pm9"
    yaw: "pm10"
    y: "pm5"
    th: "pm6"
    curv: "pm1"
    ell: "pm2"
    fu: "m5"
    fd: "m6"
    x1u: "m1"
    x2d: "m2"
    y1u: "m3"
    y2d: "m4"
  labels: ["VFM"]

- name: wbslit
  prefix: "30ida:"
  # TODO: apstools might have a support class if there is EPICS database support
  motors:
    vertical_bottom: "m1"
    horizontal_right: "m2"
    vertical_top: "m3"
    horizontal_left: "m4"
  labels: ["slit"]


hklpy2.creator:
- name: herix
  geometry: E4CH
  solver: hkl_soleil
  reals:
    th: 30idc:m26
    chi: 30idc:m27
    phi: 30idc:m28
    # tth: 30idc:Herix_theta  # FIXME: PV not found
    tth: 30idc:m25
    # TODO: additional motors on the detector arm (PVs not responding 2026-10-30)
    # x: "30idc:Herix_x"
    # y: "30idc:Herix_y"
    # z: "30idc:Herix_z"
    # ax: "30idc:Herix_ax"
    # ay: "30idc:Herix_ay"
  labels: ["diffractometer"]

- name: simherix
  geometry: E4CH
  solver: hkl_soleil
  reals: ["th", "chi", "phi", "tth"]
  labels: ["diffractometer"]


ophyd.EpicsMotor:
# TODO: did we name all motors from config not assigned otherwise here?
- {name: bim1, prefix: "30ida:m7", labels: ["motor"]}

- {name: cam_x, prefix: "30idc:m29", labels: ["motor"]}
- {name: cam_y, prefix: "30idc:m22", labels: ["motor",]}
- {name: cam_z, prefix: "30idc:m31", labels: ["motor"]}  # aka: focus

- {name: phip, prefix: "30idMCS2:m1", labels: ["motor", "PHI_plus"]}

- {name: s2th, prefix: "30idc:m25", labels: ["motor", "spectrometer"]}

- {name: secth, prefix: "30ida:m57", labels: ["motor", "secondary_mono"]}
- {name: secy, prefix: "30ida:m62", labels: ["motor", "secondary_mono"]}
- {name: secx, prefix: "30ida:m60", labels: ["motor", "secondary_mono"]}

- {name: stbly, prefix: "30idc:m16", labels: ["motor", "sample"]}
- {name: stblx, prefix: "30idc:m21", labels: ["motor", "sample"]}
- {name: stblz, prefix: "30idc:m23", labels: ["motor", "sample"]}

# Remember, energy units here are "meV"
- {name: herixE, prefix: "30idc:SM13", labels: ["motor", "energy"]}
- {name: nrsE, prefix: "30idc:SM18", labels: ["motor", "energy"]}


